name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, armhf-release]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: dnp3-bridge-build
          load: true
          cache-from: type=gha,scope=dnp3-bridge-build
          cache-to: type=gha,mode=max,scope=dnp3-bridge-build

      - name: Configure, build, test, package
        run: docker/run.sh cmake --workflow --preset ${{ matrix.preset }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/*.deb
          if-no-files-found: error
