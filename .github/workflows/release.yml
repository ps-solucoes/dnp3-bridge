name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # The package version comes from project(VERSION), so a mismatched tag
      # would publish packages under the wrong release.
      - name: Tag matches project version
        run: |
          version=$(sed -n 's/^project(dnp3-bridge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$version" = "$TAG" || { echo "tag $TAG != project version $version"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/build.Dockerfile
          tags: dnp3-bridge-build
          load: true
          cache-from: type=gha,scope=dnp3-bridge-build

      - name: Debian packages (amd64)
        run: docker/run.sh cmake --workflow --preset release

      - name: Debian packages (armhf)
        run: docker/run.sh cmake --workflow --preset armhf-release

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' \
              CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              build/release/*.deb build/armhf-release/*.deb
